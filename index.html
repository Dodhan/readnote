-shadow:0 1px 4px #0002}.primary{background:#164e42;color:white;border-color:#164e42}.primary:hover{background:#27715e}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card,article{background:white;border:1px solid #dbe2db;border-radius:13px}.card{padding:17px 22px}.card strong{display:block;font:bold 32px Georgia,serif;margin:5px 0}.card small,.sub{color:#61766b;font-size:14px}article{margin-top:16px;padding:22px 25px}h2{font-size:20px;letter-spacing:-1px;margin:0}.legend{color:#26745f;font-size:14px}.plot{overflow-x:auto;margin-top:10px}.plot svg{display:block;width:100%;height:215px}.plot circle{cursor:pointer}.detail{padding:10px 14px;background:#edf4ee;border-radius:7px;font-size:14px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e6ebe6}th{color:#63756b;background:#f6f8f5}td button{max-width:220px;white-space:normal}.scroll{overflow:auto;margin-top:15px}dialog{width:min(460px,94vw);border:1px solid #bdccc2;border-radius:14px;padding:25px;color:inherit}dialog::backdrop{background:#183b3480}textarea,input{width:100%;margin:12px 0;padding:12px;border:1px solid #aebfb3;border-radius:7px}dialog footer{display:flex;justify-content:flex-end;gap:8px}#err{color:#994221}button:focus-visible,select:focus-visible,circle:focus-visible{outline:3px solid #cd994d} @media(max-width:620px){main{padding:16px 12px}.hero{padding:22px}.books{right:-40px;opacity:.45}.cards{gap:5px}.card{padding:12px 8px}.card strong{font-size:25px}.card small,.card label{font-size:13px}article{padding:16px}.hero section{max-width:94%}}
